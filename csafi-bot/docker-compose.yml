# GPU setup (NVIDIA). For a machine without a GPU:
#   docker compose -f docker-compose.yml -f docker-compose.cpu.yml up -d
name: csafi

services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama
    environment:
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_KEEP_ALIVE: "2m"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 5s
      retries: 10

  # One-shot: pulls the two models into the ollama volume, then exits.
  ollama-pull:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - ollama pull "$${VISION_MODEL}" && ollama pull "$${TEXT_MODEL}"
    env_file: .env
    restart: "no"

  bot:
    build:
      context: .
      args:
        WHISPER_GPU: "1"
        WHISPER_MODEL: ${WHISPER_MODEL:-small}
    restart: unless-stopped
    env_file: .env
    environment:
      OLLAMA_URL: http://ollama:11434
      DATA_DIR: /app/data
    volumes:
      - ./data:/app/data
      # Only needed for the optional Drive mirror (RCLONE_REMOTE). Create it with: rclone config
      - ./rclone:/home/csafi/.config/rclone
    ports:
      - "127.0.0.1:${PORT:-8765}:8765"
    depends_on:
      ollama:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  ollama:
