<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}CSAFI Reels Library{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
  <script type="module" src="/static/app.js"></script>
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <a class="brand" href="/"><span class="logo" aria-hidden="true"></span><b>CSAFI</b><span>Reels Library</span></a>
      {% block topright %}{% endblock %}
    </div>
  </header>
  <main class="wrap">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
