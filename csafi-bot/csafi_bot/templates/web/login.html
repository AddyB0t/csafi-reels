{% extends "base.html" %}
{% block title %}Sign in · CSAFI Reels Library{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Sign in</h1>
  <p class="muted">Enter the dashboard token from your <code>.env</code> file.</p>
  {% if error %}<p class="alert error">That token is not correct.</p>{% endif %}
  <form method="post" action="/login" class="stack">
    <label class="field"><span>Dashboard token</span>
      <input id="token" name="token" type="password" autocomplete="current-password" required autofocus>
    </label>
    <button type="submit" class="btn primary">Sign in</button>
  </form>
</section>
{% endblock %}
